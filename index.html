<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAGNÓSTICO V1.1 - RH NAVOJOA</title>
    
    <!-- Bootstrap (Diseño básico) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #333; color: white; font-family: monospace; padding: 20px; }
        .status-box { padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 1.5rem; font-weight: bold; border: 2px solid white; }
        .bg-yellow { background-color: #ffc107; color: black; }
        .bg-green { background-color: #198754; color: white; }
        .bg-red { background-color: #dc3545; color: white; }
        
        #console-screen {
            background-color: black;
            color: #00ff00;
            border: 1px solid #444;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre-wrap; /* Mantiene saltos de línea */
        }
        
        .error-log { color: #ff5555; font-weight: bold; border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 5px; display: block; }
    </style>

    <!-- 1. TRAMPA DE ERRORES GLOBAL (Debe ir antes de todo) -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const screen = document.getElementById('console-screen');
            if(screen) {
                screen.innerHTML += `<div class="error-log">💥 ERROR FATAL: ${message}\nEn: ${source}:${lineno}</div>`;
            }
            const status = document.getElementById('main-status');
            if(status) {
                status.className = "status-box bg-red";
                status.innerText = "SISTEMA DETENIDO POR ERROR";
            }
            // No bloquear el navegador
            return false; 
        };
    </script>
</head>
<body>

<div class="container">
    <h3 class="mb-4 text-center">PANEL DE DIAGNÓSTICO FORENSE</h3>

    <!-- INDICADOR DE ESTADO -->
    <div id="main-status" class="status-box bg-yellow">
        INICIANDO MOTORES...
    </div>

    <div class="d-grid gap-2 mb-4">
        <button class="btn btn-light btn-lg fw-bold" onclick="iniciarDiagnostico()">▶ FORZAR INICIO MANUAL</button>
    </div>

    <!-- PANTALLA NEGRA DE LOGS -->
    <div class="card bg-dark border-secondary">
        <div class="card-header border-secondary text-white">Registro de Operaciones (Logs)</div>
        <div class="card-body p-0">
            <div id="console-screen">Esperando carga de librerías...<br></div>
        </div>
    </div>
</div>

<!-- 2. LIBRERÍAS FIREBASE (CDN ALTERNATIVO MÁS ESTABLE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-storage.js"></script>

<script>
    // Función para escribir en la pantalla negra
    function log(msg) {
        const screen = document.getElementById('console-screen');
        const time = new Date().toLocaleTimeString();
        screen.innerHTML += `[${time}] ${msg}<br>`;
        screen.scrollTop = screen.scrollHeight;
    }

    function ok(msg) {
        const screen = document.getElementById('console-screen');
        screen.innerHTML += `<span style="color:cyan">✔ ${msg}</span><br>`;
    }

    // --- CONFIGURACIÓN FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCAylvD_RQ6Z2ZtaUP2ONWe4qVYod9LECo",
      authDomain: "rh-navojoa.firebaseapp.com",
      projectId: "rh-navojoa",
      storageBucket: "rh-navojoa.firebasestorage.app",
      messagingSenderId: "938217771194",
      appId: "1:938217771194:web:f620e8987e714a9f177283"
    };

    function iniciarDiagnostico() {
        log("-------------------------------------");
        log("Iniciando secuencia de prueba...");

        // 1. Verificar si Firebase se descargó
        if (typeof firebase === 'undefined') {
            log("❌ ERROR CRÍTICO: La librería 'firebase' no existe. El navegador bloqueó la descarga.");
            document.getElementById('main-status').className = "status-box bg-red";
            document.getElementById('main-status').innerText = "ERROR DE RED (LIBRERÍAS)";
            return;
        }
        ok("Librerías Firebase detectadas.");

        try {
            // 2. Inicializar App
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                ok("App Firebase Inicializada.");
            } else {
                log("App ya estaba inicializada.");
            }

            // 3. Conectar Servicios
            const db = firebase.firestore();
            const storage = firebase.storage();
            ok("Servicios (DB y Storage) vinculados.");

            // 4. PRUEBA DE FUEGO: Escribir en Base de Datos
            log("Intentando escribir en colección '_diagnostico'...");
            
            db.collection("_diagnostico").add({
                prueba: "Conexión Exitosa desde Vercel",
                fecha: new Date().toString(),
                navegador: navigator.userAgent
            })
            .then((docRef) => {
                ok("✅ ¡ESCRITURA EXITOSA! ID: " + docRef.id);
                
                // 5. PRUEBA DE FUEGO: Leer lo escrito
                log("Intentando leer el documento...");
                return docRef.get();
            })
            .then((doc) => {
                if(doc.exists) {
                    ok("✅ ¡LECTURA EXITOSA!");
                    document.getElementById('main-status').className = "status-box bg-green";
                    document.getElementById('main-status').innerText = "CONEXIÓN EXITOSA (100%)";
                    log("CONCLUSIÓN: El problema NO es la conexión. Es el código del sistema principal.");
                }
            })
            .catch((error) => {
                console.error(error);
                let explicacion = "Error desconocido";
                if(error.code === 'permission-denied') explicacion = "Tus Reglas de Seguridad bloquean la escritura.";
                if(error.code === 'unavailable') explicacion = "No hay internet o el firewall bloquea Firebase.";
                
                log(`❌ FALLO: ${explicacion}`);
                log(`Detalle técnico: ${error.message}`);
                document.getElementById('main-status').className = "status-box bg-red";
                document.getElementById('main-status').innerText = "FALLO EN BASE DE DATOS";
            });

        } catch (e) {
            log("❌ Excepción de Código: " + e.message);
        }
    }

    // Auto-arranque seguro
    window.addEventListener('load', () => {
        log("Ventana cargada. Ejecutando diagnóstico automático en 1 seg...");
        setTimeout(iniciarDiagnostico, 1000);
    });

</script>

</body>
</html>
